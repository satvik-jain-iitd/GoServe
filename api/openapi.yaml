# Story #338 (E27, plan v2 B.2): the one file the apps and the server agree on. Every function is a path. Every path names its handler (x-handler),
# and `deno test --allow-read api` calls that handler and checks the answer against the schema below. Schemas close their objects
# (additionalProperties false), so a renamed or extra field turns CI red. The dev project is the server until the owner says otherwise.
openapi: 3.1.0
info:
  title: GoServe API v2
  version: 0.1.0
  description: Backend v2 on Supabase Edge Functions. This is the skeleton; each story adds its paths.
servers:
  - url: https://tmxyizmkpwwfyazvrfhw.supabase.co/functions/v1
    description: dev (goserve-dev)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Is the server up
      x-handler: ../supabase/functions/health/index.ts
      responses:
        "200":
          description: The server is up. Nothing else is said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /menu:
    get:
      operationId: getMenu
      summary: The menu of one kitchen
      x-handler: ../supabase/functions/menu/index.ts
      x-contract-handler: ../supabase/functions/menu/fixture.ts
      parameters:
        - name: kitchen
          in: query
          required: true
          schema: { type: string, format: uuid }
          example: 7e57ab1e-0000-4000-8000-000000000001
      responses:
        "200":
          description: Categories in order, then collections (only the ones that have dishes). Sold-out dishes stay on the menu with sold_out true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          description: The kitchen id is missing or not a uuid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The menu could not be read. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /quote:
    post:
      operationId: postQuote
      summary: The one bill. Lines, address and an optional coupon in; every rupee out.
      x-handler: ../supabase/functions/quote/index.ts
      x-contract-handler: ../supabase/functions/quote/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kitchen_id, lines, address]
              properties:
                kitchen_id: { type: string, format: uuid }
                lines:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [menu_item_id, qty]
                    properties:
                      menu_item_id: { type: string, format: uuid }
                      qty: { type: integer, minimum: 1, maximum: 20 }
                      option_ids:
                        type: array
                        items: { type: string, format: uuid }
                address:
                  type: object
                  required: [pin_code]
                  properties:
                    pin_code: { type: string, pattern: "^[0-9]{6}$" }
                coupon_code: { type: string, maxLength: 40 }
      responses:
        "200":
          description: The quote. Prices come from the catalog; a price in the request is ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: The request is malformed (no kitchen, no lines, a bad pin code or coupon, too many lines, not JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A rule refused the order (empty, sold out, quantity, add-on pick, coupon rule). error is a stable code, message is for the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: A data source failed. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /serviceability:
    get:
      operationId: getServiceability
      summary: Can a kitchen deliver to this place, how soon, and is it open
      x-handler: ../supabase/functions/serviceability/index.ts
      x-contract-handler: ../supabase/functions/serviceability/fixture.ts
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
          example: 28.5494
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
          example: 77.2001
      responses:
        "200":
          description: Kitchens that reach the place, nearest first. None in range gives serviceable false and request_here true (the app offers 'Request here').
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Serviceability"
        "400":
          description: The place is missing, not a number, or out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The kitchens could not be read. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      operationId: postOrders
      summary: Place an order. Re-quotes the cart, then writes the order in one transaction. The same idempotency key answers the same order.
      x-handler: ../supabase/functions/orders/index.ts
      x-contract-handler: ../supabase/functions/orders/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kitchen_id, lines, address, idempotency_key, expected_to_pay_paise]
              properties:
                kitchen_id: { type: string, format: uuid }
                lines:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [menu_item_id, qty]
                    properties:
                      menu_item_id: { type: string, format: uuid }
                      qty: { type: integer, minimum: 1, maximum: 20 }
                      option_ids:
                        type: array
                        items: { type: string, format: uuid }
                address:
                  type: object
                  required: [pin_code, text]
                  properties:
                    pin_code: { type: string, pattern: "^[0-9]{6}$" }
                    text: { type: string, minLength: 1, maxLength: 300 }
                coupon_code: { type: string, maxLength: 40 }
                idempotency_key: { type: string, minLength: 8, maxLength: 64 }
                expected_to_pay_paise: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The same idempotency key was used before. This is the order that already exists (created false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPlaced"
        "201":
          description: The order was placed (created true).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPlaced"
        "400":
          description: The request is malformed (no kitchen, no lines, a bad pin code, no address text, a short key, no expected price, not JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login (an anonymous login counts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The price is not the one the customer saw. The body carries the new quote when the app can show it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceChanged"
        "422":
          description: A rule refused the order (empty, sold_out, kitchen_closed, quantity, add-on pick, coupon rule, session_order_cap). error is a stable code, message is for the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: A data source failed. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /order-actions:
    post:
      operationId: postOrderActions
      summary: Take a step on an order. The login decides who may do which step.
      description: "accept, prepare, ready (kitchen staff or admin); pickup, arriving, deliver (the assigned rider or admin); confirm (the customer who placed it); cancel (customer, kitchen staff or admin, only while placed or accepted, a reason needed unless the customer cancels)."
      x-handler: ../supabase/functions/order-actions/index.ts
      x-contract-handler: ../supabase/functions/order-actions/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order_id, action]
              properties:
                order_id: { type: string, format: uuid }
                action: { enum: [accept, prepare, ready, pickup, arriving, deliver, confirm, cancel] }
                reason: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The step was taken. The order carries its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStep"
        "400":
          description: The request is malformed (bad order id, unknown action, reason too long, not JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: This person may not take this step on this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: The order was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The step was already done (already_done), the order is not at the step before it (illegal_step), or it is too late to cancel (cannot_cancel).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: A reason is needed to cancel (reason_required).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "500":
          description: The database refused the step for a reason that is not listed (order_action_failed). No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /otp/send:
    post:
      operationId: postOtpSend
      summary: Send a six digit code to a phone number
      description: "TEST DOUBLE until the owner picks the SMS provider: the sender is FakeSms and delivers nothing (docs/product/founder-checklist.md). The rules are in the database: 3 sends per phone per 10 minutes, 5 tries per code, 10 minutes of life, one use. The code is never in an answer."
      x-handler: ../supabase/functions/otp/index.ts
      x-contract-handler: ../supabase/functions/otp/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: "^[6-9][0-9]{9}$" }
      responses:
        "200":
          description: The code was sent (to the sender; never in this answer).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSent"
        "400":
          description: The request is malformed (no phone, a code that is not six digits, not JSON) or the phone is not an Indian mobile number (invalid_phone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal400"
        "401":
          description: There is no login (an anonymous login counts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "429":
          description: Too many codes for this phone (too_many_sends).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database or the sender could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /otp/verify:
    post:
      operationId: postOtpVerify
      summary: Check the code and link the phone to the caller's own user
      description: "TEST DOUBLE until the owner picks the SMS provider: the sender is FakeSms and delivers nothing (docs/product/founder-checklist.md). The rules are in the database: 3 sends per phone per 10 minutes, 5 tries per code, 10 minutes of life, one use. The code is never in an answer."
      x-handler: ../supabase/functions/otp/index.ts
      x-contract-handler: ../supabase/functions/otp/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string, pattern: "^[6-9][0-9]{9}$" }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: The code is right. The phone is linked to the caller's user, so the user id and the guest orders stay. The client refreshes its session to see the phone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerified"
        "400":
          description: The request is malformed (no phone, a code that is not six digits, not JSON) or the phone is not an Indian mobile number (invalid_phone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal400"
        "401":
          description: There is no login (an anonymous login counts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: This number already belongs to another account (phone_in_use). A returning customer on a new phone needs the real provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: The code is wrong, old or missing (wrong_code, code_expired, no_code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "429":
          description: Too many wrong tries (too_many_attempts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database or the sender could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payments/create:
    post:
      operationId: postPaymentsCreate
      summary: Start an online payment for an order the caller placed
      description: "TEST DOUBLE until the owner's Razorpay KYC click: the gateway is FakeGateway (docs/product/founder-checklist.md). The amount comes from the order in the database, never from the request. The order becomes online and waits for the payment; cash on delivery never calls this."
      x-handler: ../supabase/functions/payments/index.ts
      x-contract-handler: ../supabase/functions/payments/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order_id]
              properties:
                order_id: { type: string, format: uuid }
      responses:
        "200":
          description: The payment order. An open payment for the order is returned again, not made twice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCreated"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: The order was not found (also for an order that is not the caller's).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The order cannot be paid now (order_not_payable) or is already paid (already_paid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database or the gateway could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payments/webhook:
    post:
      operationId: postPaymentsWebhook
      summary: The gateway tells us a payment was made
      description: "No login: the signature is the proof. signature = hex HMAC-SHA256 over provider_order_id|provider_payment_id with our own secret (PAYMENTS_WEBHOOK_SECRET), the Razorpay shape. A bad signature is 400 and writes nothing. A repeat answers 200."
      x-handler: ../supabase/functions/payments/index.ts
      x-contract-handler: ../supabase/functions/payments/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_order_id, provider_payment_id, signature]
              properties:
                provider_order_id: { type: string }
                provider_payment_id: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: The order is paid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPaid"
        "400":
          description: The signature is wrong or missing (invalid_signature), or the request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The payment is not known (payment_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The payment was closed (payment_closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The webhook secret is not set (webhook_not_configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payments/switch-to-cash:
    post:
      operationId: postPaymentsSwitchToCash
      summary: The customer pays cash instead of online
      description: "The payment still open for the order is closed as failed and the order goes to cash on delivery now, so the kitchen can accept it. An order that is already cash stays cash. A paid order is refused."
      x-handler: ../supabase/functions/payments/index.ts
      x-contract-handler: ../supabase/functions/payments/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order_id]
              properties:
                order_id: { type: string, format: uuid }
      responses:
        "200":
          description: The order is cash on delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchedToCash"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: The order was not found (also for an order that is not the caller's).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The order is already paid (already_paid) or cannot be changed now (order_not_payable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /coupons:
    get:
      operationId: getCoupons
      summary: The coupons valid now
      description: "Active, inside their dates, under their max uses. Which one is best for a cart is the quote's job: POST /quote returns offers, best first."
      x-handler: ../supabase/functions/coupons/index.ts
      x-contract-handler: ../supabase/functions/coupons/fixture.ts
      responses:
        "200":
          description: The list, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponList"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/rating:
    post:
      operationId: postOrderRating
      summary: The customer rates the food and the rider of a delivered order
      description: "One rating per order, from the customer who placed it, once it is delivered. Scores are whole numbers 1 to 5. The rider score is optional and refused (no_rider) for an order that had no rider. Same function as POST /orders."
      x-handler: ../supabase/functions/orders/index.ts
      x-contract-handler: ../supabase/functions/orders/fixture.ts
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [food_score]
              properties:
                food_score: { type: integer, minimum: 1, maximum: 5 }
                rider_score: { type: [integer, "null"], minimum: 1, maximum: 5 }
                comment: { type: [string, "null"], maxLength: 500 }
      responses:
        "200":
          description: The rating is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingStored"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The order was not found (also for an order that is not the caller's).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The order is not delivered yet (not_delivered) or was already rated (already_rated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: A score is not 1 to 5 (invalid_score), the note is too long (invalid_comment) or the order had no rider (no_rider).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me:
    get:
      operationId: getMe
      summary: The caller's own name and email
      description: "Read from the bearer token; nobody can name another user. A customer who has set nothing gets null for both."
      x-handler: ../supabase/functions/me/index.ts
      x-contract-handler: ../supabase/functions/me/fixture.ts
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "410":
          description: The account was deleted (account_deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: patchMe
      summary: Change the caller's name or email
      description: "Send the fields to change. A field left out stays; an empty string clears it. At least one field."
      x-handler: ../supabase/functions/me/index.ts
      x-contract-handler: ../supabase/functions/me/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileSaved"
        "400":
          description: The request is malformed (not text fields, or none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "410":
          description: The account was deleted (account_deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: A bad name (invalid_name) or email (invalid_email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMe
      summary: Delete the caller's account
      description: "A soft delete at once: the profile is hidden and emptied and the pings stop. A job later removes the personal rows, blanks the name, phone and address on their orders and deletes the login."
      x-handler: ../supabase/functions/me/index.ts
      x-contract-handler: ../supabase/functions/me/fixture.ts
      responses:
        "200":
          description: The account is soft-deleted (a second delete answers the same).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileSaved"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff/mine:
    get:
      operationId: getStaffMine
      summary: The kitchens the caller belongs to, with their role in each
      description: "One person can own one kitchen and work in another. The old role kitchen reads as staff. Read from the bearer token."
      x-handler: ../supabase/functions/staff/index.ts
      x-contract-handler: ../supabase/functions/staff/fixture.ts
      responses:
        "200":
          description: The kitchens, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyKitchens"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /staff:
    post:
      operationId: postStaff
      summary: An admin adds one person to one kitchen
      description: "Adds one membership and touches no other. Adding the same one again changes the role. Admin only."
      x-handler: ../supabase/functions/staff/index.ts
      x-contract-handler: ../supabase/functions/staff/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kitchen_id, user_id, role]
              properties:
                kitchen_id: { type: string, format: uuid }
                user_id: { type: string, format: uuid }
                role: { enum: [owner, staff] }
      responses:
        "200":
          description: The membership exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffChanged"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: The caller is not an admin (not_allowed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: The kitchen or the person is not there (kitchen_not_found, user_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "422":
          description: The role is not owner or staff (invalid_role).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteStaff
      summary: An admin removes one person from one kitchen
      description: "Removes this one membership and no other. Admin only."
      x-handler: ../supabase/functions/staff/index.ts
      x-contract-handler: ../supabase/functions/staff/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kitchen_id, user_id]
              properties:
                kitchen_id: { type: string, format: uuid }
                user_id: { type: string, format: uuid }
      responses:
        "200":
          description: The membership is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffChanged"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: The caller is not an admin (not_allowed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "404":
          description: The person does not work in this kitchen (membership_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /help:
    get:
      operationId: getHelp
      summary: The help topics with their questions and answers
      description: "From the faq table, in the owner's order; a switched-off question and a topic with none left are not returned."
      x-handler: ../supabase/functions/help/index.ts
      x-contract-handler: ../supabase/functions/help/fixture.ts
      responses:
        "200":
          description: The topics, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Help"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /otp/claim:
    post:
      operationId: postOtpClaim
      summary: A returning customer moves the orders of a guest session to their own account
      description: "The caller is signed in as the old account (it signed in with Supabase's own phone sign-in, test OTP in dev). The body carries the guest session's access token. Both tokens are checked; only a guest can be moved, only into a signed-in account."
      x-handler: ../supabase/functions/otp/index.ts
      x-contract-handler: ../supabase/functions/otp/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [guest_token]
              properties:
                guest_token: { type: string, minLength: 1 }
      responses:
        "200":
          description: The orders of the guest session are on the caller's account (moved is how many).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpClaimed"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal400"
        "401":
          description: A token is missing or not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "403":
          description: The caller is still a guest (not_signed_in).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "409":
          description: The other session is not a guest (not_a_guest).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached or the move failed (claim_failed). No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal400"
  /push/register:
    post:
      operationId: postPushRegister
      summary: The app saves the push token of this device
      description: "TEST DOUBLE until the owner's FCM and Apple Developer clicks: the sender is FakePush (docs/product/founder-checklist.md). The signed-in caller saves its device token and platform. The same token twice is one row; a token that moves to another user follows the new user."
      x-handler: ../supabase/functions/push/index.ts
      x-contract-handler: ../supabase/functions/push/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, token]
              properties:
                platform: { enum: [android, ios] }
                token: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: The device is saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegistered"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /push/notify:
    post:
      operationId: postPushNotify
      summary: The system says an order changed; every device of its customer gets a push
      description: "Not for apps. The caller is the system and proves it with our own secret in the x-push-secret header (PUSH_NOTIFY_SECRET). The text comes from the order status. A token the push service says is dead is forgotten. A failed send is counted, not hidden."
      x-handler: ../supabase/functions/push/index.ts
      x-contract-handler: ../supabase/functions/push/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order_id]
              properties:
                order_id: { type: string, format: uuid }
      responses:
        "200":
          description: The pushes were tried. A customer with no device gives sent 0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushNotified"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The secret is wrong or missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The order was not found (order_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "503":
          description: The notify secret is not set (notify_not_configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The database could not be reached. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok:
          const: false
        error:
          type: string
    Refusal:
      type: object
      additionalProperties: false
      required: [ok, error, message]
      properties:
        ok:
          const: false
        error: { type: string }
        message: { type: string }
    Quote:
      type: object
      additionalProperties: false
      required: [ok, kitchen_id, lines, item_total_paise, fees, discount_paise, coupon, tax_paise, tax_mode, to_pay_paise, saved_paise, offers]
      properties:
        ok:
          const: true
        kitchen_id: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [menu_item_id, name, qty, unit_paise, extras_paise, line_paise, options]
            properties:
              menu_item_id: { type: string }
              name: { type: string }
              qty: { type: integer, minimum: 1 }
              unit_paise: { type: integer, minimum: 0 }
              extras_paise: { type: integer, minimum: 0 }
              line_paise: { type: integer, minimum: 0 }
              options:
                type: array
                items: { type: string }
        item_total_paise: { type: integer, minimum: 0 }
        fees:
          type: object
          additionalProperties: false
          required: [delivery_paise, packaging_paise, total_paise]
          properties:
            delivery_paise: { type: integer, minimum: 0 }
            packaging_paise: { type: integer, minimum: 0 }
            total_paise: { type: integer, minimum: 0 }
        discount_paise: { type: integer, minimum: 0 }
        coupon:
          type: [object, "null"]
          additionalProperties: false
          required: [code, title]
          properties:
            code: { type: string }
            title: { type: string }
        tax_paise: { type: integer, minimum: 0 }
        tax_mode: { enum: [inclusive, exclusive] }
        to_pay_paise: { type: integer, minimum: 0 }
        saved_paise: { type: integer, minimum: 0 }
        offers:
          description: "Every valid coupon that applies to this cart, best saving first (a tie: the smaller code). The first one is applied unless the customer typed a code."
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, title, saves_paise]
            properties:
              code: { type: string }
              title: { type: string }
              saves_paise: { type: integer, minimum: 1 }
    Serviceability:
      type: object
      additionalProperties: false
      required: [ok, serviceable, request_here, kitchens]
      properties:
        ok:
          const: true
        serviceable: { type: boolean }
        request_here: { type: boolean }
        kitchens:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kitchen_id, name, distance_m, eta_min, open]
            properties:
              kitchen_id: { type: string }
              name: { type: string }
              distance_m: { type: integer, minimum: 0 }
              eta_min: { type: integer, minimum: 0 }
              open: { type: boolean }
    OrderPlaced:
      type: object
      additionalProperties: false
      required: [ok, created, order]
      properties:
        ok:
          const: true
        created: { type: boolean }
        order:
          $ref: "#/components/schemas/OrderOut"
    OrderOut:
      type: object
      additionalProperties: false
      required: [id, kitchen_id, status, total_paise, address, items, bill, created_at]
      properties:
        id: { type: string }
        kitchen_id: { type: string }
        status: { enum: [placed, accepted, preparing, ready, out_for_delivery, delivered, cancelled] }
        total_paise: { type: integer, minimum: 0 }
        address: { type: string }
        items: { type: array }
        bill: { type: object }
        created_at: { type: string, format: date-time }
    OrderStep:
      type: object
      additionalProperties: false
      required: [ok, order]
      properties:
        ok:
          const: true
        order:
          $ref: "#/components/schemas/OrderOut"
    PriceChanged:
      type: object
      additionalProperties: false
      required: [ok, error, message]
      properties:
        ok:
          const: false
        error:
          const: price_changed
        message: { type: string }
        quote:
          $ref: "#/components/schemas/Quote"
    Refusal400:
      description: A refusal or a plain error; the message is present for a refusal.
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok:
          const: false
        error: { type: string }
        message: { type: string }
    OtpClaimed:
      type: object
      additionalProperties: false
      required: [ok, moved]
      properties:
        ok:
          const: true
        moved: { type: integer, minimum: 0 }
    OtpSent:
      type: object
      additionalProperties: false
      required: [ok, expires_in_s]
      properties:
        ok:
          const: true
        expires_in_s: { type: integer, minimum: 1 }
    OtpVerified:
      type: object
      additionalProperties: false
      required: [ok, linked, phone, user_id]
      properties:
        ok:
          const: true
        linked:
          const: true
        phone: { type: string, pattern: "^91[6-9][0-9]{9}$" }
        user_id: { type: string }
    PaymentCreated:
      type: object
      additionalProperties: false
      required: [ok, provider, provider_order_id, amount_paise, currency]
      properties:
        ok:
          const: true
        provider: { type: string }
        provider_order_id: { type: string }
        amount_paise: { type: integer, minimum: 0 }
        currency: { const: INR }
    PaymentPaid:
      type: object
      additionalProperties: false
      required: [ok, order_id]
      properties:
        ok:
          const: true
        order_id: { type: string }
    RatingStored:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          const: true
    SwitchedToCash:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          const: true
    PushRegistered:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          const: true
    PushNotified:
      type: object
      additionalProperties: false
      required: [ok, sent, failed, forgotten]
      properties:
        ok:
          const: true
        sent: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        forgotten: { type: integer, minimum: 0 }
    CouponList:
      type: object
      additionalProperties: false
      required: [ok, coupons]
      properties:
        ok:
          const: true
        coupons:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, title, kind, amount_paise, percent, cap_paise, min_order_paise, first_order_only]
            properties:
              code: { type: string }
              title: { type: string }
              kind: { enum: [flat, percent] }
              amount_paise: { type: integer, minimum: 0 }
              percent: { type: integer, minimum: 0, maximum: 100 }
              cap_paise: { type: integer, minimum: 0 }
              min_order_paise: { type: integer, minimum: 0 }
              first_order_only: { type: boolean }
    MyProfile:
      type: object
      additionalProperties: false
      required: [ok, profile]
      properties:
        ok:
          const: true
        profile:
          type: object
          additionalProperties: false
          required: [name, email]
          properties:
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
    MyProfileSaved:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          const: true
    MyKitchens:
      type: object
      additionalProperties: false
      required: [ok, kitchens]
      properties:
        ok:
          const: true
        kitchens:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kitchen_id, name, role]
            properties:
              kitchen_id: { type: string, format: uuid }
              name: { type: string }
              role: { enum: [owner, staff] }
    StaffChanged:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          const: true
    Help:
      type: object
      additionalProperties: false
      required: [ok, topics]
      properties:
        ok:
          const: true
        topics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [topic, items]
            properties:
              topic: { type: string }
              items:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [question, answer]
                  properties:
                    question: { type: string }
                    answer: { type: string }
    Dish:
      type: object
      additionalProperties: false
      required: [id, name, price_paise, veg, category, image_url, badge, size_tag, protein_g, sold_out, back_soon, back_soon_at, option_groups]
      properties:
        id: { type: string }
        name: { type: string }
        price_paise: { type: integer, minimum: 1 }
        veg: { type: boolean }
        category: { type: string }
        image_url: { type: [string, "null"] }
        badge: { enum: [bestseller, new, chef, null] }
        size_tag: { enum: [small, regular, large, null] }
        protein_g: { type: [integer, "null"], minimum: 0 }
        sold_out: { type: boolean }
        back_soon: { type: boolean }
        back_soon_at: { type: [string, "null"], format: date-time }
        option_groups:
          type: array
          items:
            $ref: "#/components/schemas/OptionGroup"
    OptionGroup:
      type: object
      additionalProperties: false
      required: [id, name, min, max, options]
      description: A choice on a dish (spice level, extras). The customer picks at least min and at most max; validate_options (the database) is the one judge.
      properties:
        id: { type: string }
        name: { type: string }
        min: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 1 }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, price_paise, sold_out]
            properties:
              id: { type: string }
              name: { type: string }
              price_paise: { type: integer, minimum: 0 }
              sold_out: { type: boolean }
    Menu:
      type: object
      additionalProperties: false
      required: [ok, kitchen_id, categories, collections]
      properties:
        ok:
          const: true
        kitchen_id: { type: string, format: uuid }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, dishes]
            properties:
              name: { type: string }
              dishes:
                type: array
                items:
                  $ref: "#/components/schemas/Dish"
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, title, dish_ids]
            properties:
              key: { enum: [bestsellers, under_99, new] }
              title: { type: string }
              dish_ids:
                type: array
                items: { type: string }
    Health:
      type: object
      additionalProperties: false
      required: [ok, service, time]
      properties:
        ok:
          const: true
        service:
          const: health
        time:
          type: string
          format: date-time
