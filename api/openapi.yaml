# Story #338 (E27, plan v2 B.2): the one file the apps and the server agree on. Every function is a path. Every path names its handler (x-handler),
# and `deno test --allow-read api` calls that handler and checks the answer against the schema below. Schemas close their objects
# (additionalProperties false), so a renamed or extra field turns CI red. The dev project is the server until the owner says otherwise.
openapi: 3.1.0
info:
  title: GoServe API v2
  version: 0.1.0
  description: Backend v2 on Supabase Edge Functions. This is the skeleton; each story adds its paths.
servers:
  - url: https://tmxyizmkpwwfyazvrfhw.supabase.co/functions/v1
    description: dev (goserve-dev)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Is the server up
      x-handler: ../supabase/functions/health/index.ts
      responses:
        "200":
          description: The server is up. Nothing else is said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /menu:
    get:
      operationId: getMenu
      summary: The menu of one kitchen
      x-handler: ../supabase/functions/menu/index.ts
      x-contract-handler: ../supabase/functions/menu/fixture.ts
      parameters:
        - name: kitchen
          in: query
          required: true
          schema: { type: string, format: uuid }
          example: 7e57ab1e-0000-4000-8000-000000000001
      responses:
        "200":
          description: Categories in order, then collections (only the ones that have dishes). Sold-out dishes stay on the menu with sold_out true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          description: The kitchen id is missing or not a uuid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The menu could not be read. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /quote:
    post:
      operationId: postQuote
      summary: The one bill. Lines, address and an optional coupon in; every rupee out.
      x-handler: ../supabase/functions/quote/index.ts
      x-contract-handler: ../supabase/functions/quote/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kitchen_id, lines, address]
              properties:
                kitchen_id: { type: string, format: uuid }
                lines:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [menu_item_id, qty]
                    properties:
                      menu_item_id: { type: string, format: uuid }
                      qty: { type: integer, minimum: 1, maximum: 20 }
                      option_ids:
                        type: array
                        items: { type: string, format: uuid }
                address:
                  type: object
                  required: [pin_code]
                  properties:
                    pin_code: { type: string, pattern: "^[0-9]{6}$" }
                coupon_code: { type: string, maxLength: 40 }
      responses:
        "200":
          description: The quote. Prices come from the catalog; a price in the request is ignored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: The request is malformed (no kitchen, no lines, a bad pin code or coupon, too many lines, not JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A rule refused the order (empty, sold out, quantity, add-on pick, coupon rule). error is a stable code, message is for the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: A data source failed. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /serviceability:
    get:
      operationId: getServiceability
      summary: Can a kitchen deliver to this place, how soon, and is it open
      x-handler: ../supabase/functions/serviceability/index.ts
      x-contract-handler: ../supabase/functions/serviceability/fixture.ts
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
          example: 28.5494
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
          example: 77.2001
      responses:
        "200":
          description: Kitchens that reach the place, nearest first. None in range gives serviceable false and request_here true (the app offers 'Request here').
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Serviceability"
        "400":
          description: The place is missing, not a number, or out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The kitchens could not be read. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      operationId: postOrders
      summary: Place an order. Re-quotes the cart, then writes the order in one transaction. The same idempotency key answers the same order.
      x-handler: ../supabase/functions/orders/index.ts
      x-contract-handler: ../supabase/functions/orders/fixture.ts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kitchen_id, lines, address, idempotency_key, expected_to_pay_paise]
              properties:
                kitchen_id: { type: string, format: uuid }
                lines:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [menu_item_id, qty]
                    properties:
                      menu_item_id: { type: string, format: uuid }
                      qty: { type: integer, minimum: 1, maximum: 20 }
                      option_ids:
                        type: array
                        items: { type: string, format: uuid }
                address:
                  type: object
                  required: [pin_code, text]
                  properties:
                    pin_code: { type: string, pattern: "^[0-9]{6}$" }
                    text: { type: string, minLength: 1, maxLength: 300 }
                coupon_code: { type: string, maxLength: 40 }
                idempotency_key: { type: string, minLength: 8, maxLength: 64 }
                expected_to_pay_paise: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The same idempotency key was used before. This is the order that already exists (created false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPlaced"
        "201":
          description: The order was placed (created true).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPlaced"
        "400":
          description: The request is malformed (no kitchen, no lines, a bad pin code, no address text, a short key, no expected price, not JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: There is no login (an anonymous login counts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The price is not the one the customer saw. The body carries the new quote when the app can show it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceChanged"
        "422":
          description: A rule refused the order (empty, sold_out, kitchen_closed, quantity, add-on pick, coupon rule, session_order_cap). error is a stable code, message is for the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refusal"
        "502":
          description: A data source failed. No detail is given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok:
          const: false
        error:
          type: string
    Refusal:
      type: object
      additionalProperties: false
      required: [ok, error, message]
      properties:
        ok:
          const: false
        error: { type: string }
        message: { type: string }
    Quote:
      type: object
      additionalProperties: false
      required: [ok, kitchen_id, lines, item_total_paise, fees, discount_paise, coupon, tax_paise, tax_mode, to_pay_paise, saved_paise]
      properties:
        ok:
          const: true
        kitchen_id: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [menu_item_id, name, qty, unit_paise, extras_paise, line_paise, options]
            properties:
              menu_item_id: { type: string }
              name: { type: string }
              qty: { type: integer, minimum: 1 }
              unit_paise: { type: integer, minimum: 0 }
              extras_paise: { type: integer, minimum: 0 }
              line_paise: { type: integer, minimum: 0 }
              options:
                type: array
                items: { type: string }
        item_total_paise: { type: integer, minimum: 0 }
        fees:
          type: object
          additionalProperties: false
          required: [delivery_paise, packaging_paise, total_paise]
          properties:
            delivery_paise: { type: integer, minimum: 0 }
            packaging_paise: { type: integer, minimum: 0 }
            total_paise: { type: integer, minimum: 0 }
        discount_paise: { type: integer, minimum: 0 }
        coupon:
          type: [object, "null"]
          additionalProperties: false
          required: [code, title]
          properties:
            code: { type: string }
            title: { type: string }
        tax_paise: { type: integer, minimum: 0 }
        tax_mode: { enum: [inclusive, exclusive] }
        to_pay_paise: { type: integer, minimum: 0 }
        saved_paise: { type: integer, minimum: 0 }
    Serviceability:
      type: object
      additionalProperties: false
      required: [ok, serviceable, request_here, kitchens]
      properties:
        ok:
          const: true
        serviceable: { type: boolean }
        request_here: { type: boolean }
        kitchens:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kitchen_id, name, distance_m, eta_min, open]
            properties:
              kitchen_id: { type: string }
              name: { type: string }
              distance_m: { type: integer, minimum: 0 }
              eta_min: { type: integer, minimum: 0 }
              open: { type: boolean }
    OrderPlaced:
      type: object
      additionalProperties: false
      required: [ok, created, order]
      properties:
        ok:
          const: true
        created: { type: boolean }
        order:
          type: object
          additionalProperties: false
          required: [id, kitchen_id, status, total_paise, address, items, bill, created_at]
          properties:
            id: { type: string }
            kitchen_id: { type: string }
            status: { enum: [placed, accepted, preparing, ready, out_for_delivery, delivered, cancelled] }
            total_paise: { type: integer, minimum: 0 }
            address: { type: string }
            items: { type: array }
            bill: { type: object }
            created_at: { type: string, format: date-time }
    PriceChanged:
      type: object
      additionalProperties: false
      required: [ok, error, message]
      properties:
        ok:
          const: false
        error:
          const: price_changed
        message: { type: string }
        quote:
          $ref: "#/components/schemas/Quote"
    Dish:
      type: object
      additionalProperties: false
      required: [id, name, price_paise, veg, category, image_url, badge, size_tag, protein_g, sold_out, back_soon, back_soon_at, option_groups]
      properties:
        id: { type: string }
        name: { type: string }
        price_paise: { type: integer, minimum: 1 }
        veg: { type: boolean }
        category: { type: string }
        image_url: { type: [string, "null"] }
        badge: { enum: [bestseller, new, chef, null] }
        size_tag: { enum: [small, regular, large, null] }
        protein_g: { type: [integer, "null"], minimum: 0 }
        sold_out: { type: boolean }
        back_soon: { type: boolean }
        back_soon_at: { type: [string, "null"], format: date-time }
        option_groups:
          type: array
          items:
            $ref: "#/components/schemas/OptionGroup"
    OptionGroup:
      type: object
      additionalProperties: false
      required: [id, name, min, max, options]
      description: A choice on a dish (spice level, extras). The customer picks at least min and at most max; validate_options (the database) is the one judge.
      properties:
        id: { type: string }
        name: { type: string }
        min: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 1 }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, price_paise, sold_out]
            properties:
              id: { type: string }
              name: { type: string }
              price_paise: { type: integer, minimum: 0 }
              sold_out: { type: boolean }
    Menu:
      type: object
      additionalProperties: false
      required: [ok, kitchen_id, categories, collections]
      properties:
        ok:
          const: true
        kitchen_id: { type: string, format: uuid }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, dishes]
            properties:
              name: { type: string }
              dishes:
                type: array
                items:
                  $ref: "#/components/schemas/Dish"
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, title, dish_ids]
            properties:
              key: { enum: [bestsellers, under_99, new] }
              title: { type: string }
              dish_ids:
                type: array
                items: { type: string }
    Health:
      type: object
      additionalProperties: false
      required: [ok, service, time]
      properties:
        ok:
          const: true
        service:
          const: health
        time:
          type: string
          format: date-time
