# Install once: pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg, pre-push, prepare-commit-msg]
repos:
  - repo: local
    hooks:
      - id: guard-files
        name: no secrets, no files over 500KB, no merge markers, code blocks closed
        entry: python3 scripts/guard.py files
        language: system
        pass_filenames: true
        exclude: ^(knowledge/|.*package-lock\.json$)
      - id: guard-message
        name: commit message follows Conventional Commits
        entry: python3 scripts/check_msg_file.py
        language: system
        stages: [commit-msg]
      - id: shipquick-kit
        name: The ShipQuick kit folder is checked out
        entry: bash -c 'test -f knowledge/shipquick_latest/scripts/check_local.sh || { echo "ShipQuick, the kit folder knowledge/shipquick_latest is not checked out here. Run this, then try again -- git submodule update --init"; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
        stages: [pre-commit, pre-push, prepare-commit-msg]
      - id: check-local
        name: ShipQuick hygiene checks on this Mac
        entry: bash knowledge/shipquick_latest/scripts/check_local.sh sizes markers md-blocks secrets-staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: check-local-push
        name: All ShipQuick hygiene checks before a push
        entry: bash knowledge/shipquick_latest/scripts/check_local.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: session-trailer
        name: Add Built-by <session> to the commit message (ADR-011)
        entry: bash knowledge/shipquick_latest/scripts/session_trailer.sh
        language: system
        always_run: true
        stages: [prepare-commit-msg]
