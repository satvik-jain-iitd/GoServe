# Story #928: every day (and on demand), check that each merged migration is applied on the dev project. Read-only.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (the owner adds it). Without it the job says so and stops; it never passes silently.
name: migration drift
permissions:
  contents: read
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Compare the migration files with the dev project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN is not set, so the drift check could not run"; exit 2; fi
          python3 scripts/migration_drift.py
