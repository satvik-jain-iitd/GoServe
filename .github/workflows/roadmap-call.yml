# The live roadmap page of this project (added by ShipQuick scripts/adopt.sh): a call to the reusable workflow, pinned to one commit.
# No pull_request trigger on purpose: on a PR the job would run that PR's own unreviewed script with write rights.
# To move to a newer ShipQuick release, run adopt.sh again with --ref <tag>: it changes `uses:` and `shipquick_ref` together.
# workflow_run matches your CI workflow by its `name:` (adopt.sh read it from .github/workflows/ci.yml).
name: Roadmap page

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roadmap:
    permissions:
      contents: write
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    uses: satvik-jain-iitd/shipquick_latest/.github/workflows/roadmap.yml@49084f487ef555cbb308be4ad20bc96e8438edf6 # v0.14.2
    with:
      shipquick_ref: 49084f487ef555cbb308be4ad20bc96e8438edf6
