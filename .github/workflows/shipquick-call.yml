# The ShipQuick checks every pull request needs (added by ShipQuick scripts/adopt.sh): a call to the reusable workflow, pinned to one commit.
# To move to a newer ShipQuick release, run adopt.sh again with --ref <tag>: it changes `uses:` and `shipquick_ref` together.
name: ShipQuick checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  shipquick-checks:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: satvik-jain-iitd/shipquick_latest/.github/workflows/checks.yml@fe278c56aeede3f80ba09f36f127412965e7fb61 # v0.12.0
    with:
      shipquick_ref: fe278c56aeede3f80ba09f36f127412965e7fb61
      kit_branch: documents
      milestone: D1
