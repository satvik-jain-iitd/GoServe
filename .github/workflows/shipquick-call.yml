# The ShipQuick checks every pull request needs (added by ShipQuick scripts/adopt.sh): a call to the reusable workflow, pinned to one commit.
# To move to a newer ShipQuick release, run adopt.sh again with --ref <tag>: it changes `uses:` and `shipquick_ref` together.
name: ShipQuick checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  shipquick-checks:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: satvik-jain-iitd/shipquick_latest/.github/workflows/checks.yml@f87ddb185b57636185df6ef5ab8c63586d8634e7 # v0.11.0
    with:
      shipquick_ref: f87ddb185b57636185df6ef5ab8c63586d8634e7
      kit_branch: documents
