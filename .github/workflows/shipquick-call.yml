# The ShipQuick checks every pull request needs (added by ShipQuick scripts/adopt.sh): a call to the reusable workflow, pinned to one commit.
# To move to a newer ShipQuick release, run adopt.sh again with --ref <tag>: it changes `uses:` and `shipquick_ref` together.
name: ShipQuick checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: shipquick-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  shipquick-checks:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: satvik-jain-iitd/shipquick_latest/.github/workflows/checks.yml@e3823dd4b4a3fa328fdf077d539c3e8a43d19018 # v0.15.0
    with:
      shipquick_ref: e3823dd4b4a3fa328fdf077d539c3e8a43d19018
      kit_branch: documents
      milestone: D1
