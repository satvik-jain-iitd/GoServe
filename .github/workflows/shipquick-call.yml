# The ShipQuick checks every pull request needs (added by ShipQuick scripts/adopt.sh): a call to the reusable workflow, pinned to one commit.
# To move to a newer ShipQuick release, run adopt.sh again with --ref <tag>: it changes `uses:` and `shipquick_ref` together.
name: ShipQuick checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  shipquick-checks:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: satvik-jain-iitd/shipquick_latest/.github/workflows/checks.yml@970ff053de9e383ece3fe8f812002ed16582f381 # v0.14.1
    with:
      shipquick_ref: 970ff053de9e383ece3fe8f812002ed16582f381
      kit_branch: documents
      milestone: D1
