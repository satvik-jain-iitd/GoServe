name: Deploy app to Cloudflare Pages (prod)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "design/tokens.json"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

# Own file and own Pages project (goserve-app). deploy.yml and the investor site (letsdwelo.in) are not touched.
concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  pages:
    name: Build and publish to goserve-app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Prod keys come from their own secrets (PROD_*), never the dev ones (story #78).
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_VITE_SUPABASE_ANON_KEY }}
          VITE_ORDER_URL: ${{ secrets.PROD_VITE_ORDER_URL }}
          VITE_DEMO_TOKEN: ${{ secrets.PROD_VITE_DEMO_TOKEN }}
          VITE_SIM_URL: ${{ secrets.PROD_VITE_SIM_URL }}
          VITE_ENGINE_URL: ${{ secrets.PROD_VITE_ENGINE_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.PROD_VITE_VAPID_PUBLIC_KEY }}
          # story #1155 (owner, 9 Nov): no VITE_OTP_GATE here. Prod opens Google-first; the phone code login is paused and only the admin switch otp_login_on (settings row) turns it on. prod's otp_login_on must be false.
          VITE_MAP_TILES: https://tile.openstreetmap.org/{z}/{x}/{y}.png   # story #1181: closed test only (12 to 20 testers, light use under the OSM tile policy, no SLA). Ola tiles (#1043) before more users or production at scale.
          VITE_OTP_SMS: fixed
          VITE_BUILD: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=goserve-app --branch=main
